<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桂格直播间运营数据看板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    color: #e0e0e0;
    padding: 20px;
}
.container { max-width: 1600px; margin: 0 auto; }

/* Header */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding: 20px 30px;
    background: rgba(255,255,255,0.05);
    border-radius: 16px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
}
.header h1 {
    font-size: 24px;
    background: linear-gradient(90deg, #f5af19, #f12711);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.header-right { display: flex; align-items: center; gap: 15px; }
.update-time { font-size: 13px; color: #888; }

/* Account Switcher */
.account-switcher {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}
.account-btn {
    padding: 12px 30px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    background: rgba(255,255,255,0.05);
    color: #aaa;
    border: 1px solid rgba(255,255,255,0.1);
}
.account-btn.active {
    background: linear-gradient(135deg, #f5af19, #f12711);
    color: white;
    box-shadow: 0 4px 20px rgba(241, 39, 17, 0.3);
}

/* Tabs */
.tabs {
    display: flex;
    gap: 5px;
    margin-bottom: 20px;
    background: rgba(255,255,255,0.05);
    padding: 6px;
    border-radius: 12px;
    width: fit-content;
}
.tab-btn {
    padding: 10px 25px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s;
    background: transparent;
    color: #aaa;
}
.tab-btn.active {
    background: rgba(255,255,255,0.1);
    color: #fff;
}

/* KPI Cards */
.kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
}
.kpi-card {
    background: rgba(255,255,255,0.05);
    border-radius: 14px;
    padding: 20px;
    border: 1px solid rgba(255,255,255,0.1);
    transition: transform 0.3s;
}
.kpi-card:hover { transform: translateY(-3px); }
.kpi-label { font-size: 13px; color: #888; margin-bottom: 8px; }
.kpi-value { font-size: 28px; font-weight: 700; color: #fff; }
.kpi-value.good { color: #4ade80; }
.kpi-value.warn { color: #fbbf24; }
.kpi-value.bad { color: #f87171; }
.kpi-sub { font-size: 12px; color: #666; margin-top: 5px; }

/* Chart Cards */
.chart-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-bottom: 20px;
}
.chart-card {
    background: rgba(255,255,255,0.05);
    border-radius: 14px;
    padding: 20px;
    border: 1px solid rgba(255,255,255,0.1);
}
.chart-card.full { grid-column: 1 / -1; }
.chart-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 15px;
    color: #fff;
}
.chart-container { width: 100%; height: 350px; }

/* Funnel */
.funnel-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding: 20px 30px;
}
.conversion-wrapper {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    padding: 20px 30px;
}
.conversion-left {
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.funnel-data-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-radius: 8px;
    color: white;
    font-weight: 600;
}
.funnel-data-item .label { font-size: 14px; }
.funnel-data-item .value { font-size: 18px; }
.conversion-right {
    display: flex;
    flex-direction: column;
    gap: 20px;
}
.conversion-item {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.conversion-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.conversion-label {
    font-size: 15px;
    color: #ccc;
    font-weight: 500;
}
.conversion-value {
    font-size: 28px;
    font-weight: 700;
    color: #4ade80;
}
.conversion-target {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #888;
    font-size: 14px;
}
.conversion-target input {
    width: 60px;
    padding: 6px 10px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px;
    color: #fff;
    text-align: center;
    font-size: 14px;
}
.conversion-target input:focus {
    outline: none;
    border-color: #667eea;
}
.progress-bar {
    width: 100%;
    height: 10px;
    background: rgba(255,255,255,0.1);
    border-radius: 5px;
    overflow: hidden;
}
.progress-fill {
    height: 100%;
    border-radius: 5px;
    transition: width 0.5s ease;
}
.progress-fill.good { background: linear-gradient(90deg, #4ade80, #22c55e); }
.progress-fill.warn { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
.progress-fill.bad { background: linear-gradient(90deg, #f87171, #ef4444); }
.conversion-status {
    font-size: 13px;
    font-weight: 600;
}
.conversion-status.good { color: #4ade80; }
.conversion-status.warn { color: #fbbf24; }
.conversion-status.bad { color: #f87171; }

/* Table */
.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}
.data-table th {
    background: rgba(255,255,255,0.08);
    padding: 12px 10px;
    text-align: left;
    color: #aaa;
    font-weight: 600;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}
.data-table td {
    padding: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}
.data-table tr:hover { background: rgba(255,255,255,0.03); }
.rank-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    font-size: 12px;
    font-weight: 700;
}
.rank-1 { background: linear-gradient(135deg, #f5af19, #f12711); color: white; }
.rank-2 { background: linear-gradient(135deg, #c0c0c0, #808080); color: white; }
.rank-3 { background: linear-gradient(135deg, #cd7f32, #8b4513); color: white; }
.rank-other { background: rgba(255,255,255,0.1); color: #888; }

/* Monthly Goal */
.monthly-goal {
    background: linear-gradient(135deg, rgba(30,41,59,0.9), rgba(15,23,42,0.9));
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 20px 25px;
    margin-bottom: 20px;
}
.monthly-goal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}
.monthly-goal-title {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
}
.monthly-goal-date {
    font-size: 13px;
    color: #888;
}
.monthly-goal-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}
.monthly-goal-card {
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 15px 20px;
    border-top: 3px solid;
}
.monthly-goal-card.gmv { border-top-color: #3b82f6; }
.monthly-goal-card.cost { border-top-color: #f59e0b; }
.monthly-goal-card.roi { border-top-color: #10b981; }
.goal-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
}
.goal-card-label {
    font-size: 13px;
    color: #888;
}
.goal-card-target {
    font-size: 12px;
    color: #666;
}
.goal-card-target input {
    width: 60px;
    padding: 4px 8px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 4px;
    color: #fff;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
}
.goal-card-value {
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 10px;
}
.goal-progress {
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 6px;
}
.goal-progress-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.5s ease;
}
.goal-progress-fill.good { background: linear-gradient(90deg, #10b981, #34d399); }
.goal-progress-fill.warn { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
.goal-progress-fill.bad { background: linear-gradient(90deg, #ef4444, #f87171); }
.goal-status {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
}
.goal-status-text { font-weight: 600; }
.goal-status-text.good { color: #10b981; }
.goal-status-text.warn { color: #f59e0b; }
.goal-status-text.bad { color: #ef4444; }
.goal-status-percent { color: #666; }

/* Section */
.section { display: none; }
.section.active { display: block; }

/* Screenshot button */
.screenshot-btn {
    padding: 10px 20px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s;
}
.screenshot-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); }

/* Responsive */
@media (max-width: 1200px) {
    .chart-grid { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .header { flex-direction: column; gap: 15px; text-align: center; }
}
</style>
</head>
<body>
<div class="container">
    <!-- Header -->
    <div class="header">
        <h1>🔥 桂格直播间运营数据看板</h1>
        <div class="header-right">
            <span class="update-time" id="updateTime"></span>
            <button class="screenshot-btn" onclick="captureScreen()">📸 截图</button>
        </div>
    </div>

    <!-- Account Switcher -->
    <div class="account-switcher">
        <button class="account-btn active" onclick="switchAccount('桂格优选')">桂格优选</button>
        <button class="account-btn" onclick="switchAccount('桂格官方')">桂格官方</button>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('daily')">日数据看板</button>
        <button class="tab-btn" onclick="switchTab('stage')">阶段数据</button>
    </div>

    <!-- Daily Section -->
    <div class="section active" id="section-daily">
        <div class="monthly-goal" id="monthlyGoal"></div>
        <div class="kpi-grid" id="kpiGrid"></div>
        
        <div class="chart-grid">
            <div class="chart-card full">
                <div class="chart-title">🎯 转化率目标</div>
                <div class="conversion-wrapper">
                    <div class="conversion-left" id="funnelData"></div>
                    <div class="conversion-right" id="funnel"></div>
                </div>
            </div>
            <div class="chart-card full">
                <div class="chart-title">📊 核心指标趋势</div>
                <div class="chart-container" id="chart-multi"></div>
            </div>
        </div>

        <!-- 主播排班 -->
        <div class="chart-grid">
            <div class="chart-card full">
                <div class="chart-title">📋 主播排班（今日 & 明日）</div>
                <div id="scheduleContainer" style="display: flex; gap: 30px; flex-wrap: wrap;"></div>
            </div>
        </div>

        <!-- 主播昨日数据 -->
        <div class="chart-grid">
            <div class="chart-card full">
                <div class="chart-title">👤 主播昨日数据</div>
                <div style="overflow-x: auto;">
                    <table class="data-table" id="yesterdayAnchorTable">
                        <thead>
                            <tr>
                                <th>主播</th>
                                <th>时长(h)</th>
                                <th>成交金额</th>
                                <th>消耗</th>
                                <th>ROI</th>
                                <th>时均GMV</th>
                                <th>曝光点击率</th>
                                <th>点击成交率</th>
                                <th>场控</th>
                            </tr>
                        </thead>
                        <tbody id="yesterdayAnchorBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 主播综合排名 -->
        <div class="chart-grid">
            <div class="chart-card full">
                <div class="chart-title">🏆 主播综合排名（本月累计）</div>
                <div style="overflow-x: auto;">
                    <table class="data-table" id="anchorTable">
                        <thead>
                            <tr>
                                <th>排名</th>
                                <th>主播</th>
                                <th>直播时长(h)</th>
                                <th>成交金额(元)</th>
                                <th>消耗(元)</th>
                                <th>ROI</th>
                                <th>时均GMV</th>
                                <th>曝光点击率</th>
                                <th>点击成交率</th>
                            </tr>
                        </thead>
                        <tbody id="anchorTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Stage Section -->
    <div class="section" id="section-stage">
        <div class="kpi-grid" id="stageKpiGrid"></div>
        <div class="chart-grid">
            <div class="chart-card full">
                <div class="chart-title">📅 周度数据对比</div>
                <div class="chart-container" id="chart-weekly"></div>
            </div>
        </div>
    </div>

</div>

<script>
let rawData = null;
let currentAccount = '桂格优选';
let charts = {};

// Load data
fetch('data.json')
    .then(r => r.json())
    .then(data => {
        rawData = data;
        document.getElementById('updateTime').textContent = '更新时间: ' + data.update_time;
        renderAll();
    })
    .catch(err => console.error('Failed to load data:', err));

function getAccountData(account) {
    return rawData.daily_data.filter(d => d.account === account);
}

function getAccountAnchors(account) {
    return rawData.anchor_data.filter(d => d.account === account);
}

function switchAccount(account) {
    currentAccount = account;
    document.querySelectorAll('.account-btn').forEach((btn, i) => {
        btn.classList.toggle('active', btn.textContent === account);
    });
    renderAll();
}

function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        const tabs = ['daily', 'stage'];
        btn.classList.toggle('active', tabs[i] === tab);
    });
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById('section-' + tab).classList.add('active');
    setTimeout(() => {
        Object.values(charts).forEach(c => c && c.resize());
    }, 100);
}

function formatNumber(n, decimals = 0) {
    if (n === null || n === undefined || n === '' || isNaN(n)) return '-';
    if (n >= 10000) return (n / 10000).toFixed(1) + 'w';
    return n.toLocaleString('zh-CN', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function formatPercent(n) {
    if (n === null || n === undefined || n === '' || isNaN(n)) return '-';
    return (n * 100).toFixed(2) + '%';
}

// 全局目标值（按账号分别保存，用户可调整）
let monthlyTargets = {
    '桂格优选': { gmv: 650000, cost: 470000, roi: 1.4 },
    '桂格官方': { gmv: 1200000, cost: 550000, roi: 2.2 }
};

// 转化率目标（按账号分别保存）
let conversionTargets = {
    '桂格优选': [15, 90, 30, 15],
    '桂格官方': [15, 90, 30, 15]
};

function formatMoney(n) {
    if (n === null || n === undefined || n === '' || isNaN(n)) return '-';
    return '¥' + Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function renderAll() {
    renderDaily();
    renderStage();
}

function renderDaily() {
    const data = getAccountData(currentAccount);
    const anchors = getAccountAnchors(currentAccount);
    if (!data.length) return;
    
    // 本月运营目标
    renderMonthlyGoal(data);
    
    // 根据实际当前日期取昨天的数据，找不到则取数据里最新的一天
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const yesterdayStr = yesterday.toISOString().split('T')[0];
    let latest = data.find(d => d.date === yesterdayStr);
    if (!latest) {
        const sorted = [...data].sort((a, b) => a.date.localeCompare(b.date));
        latest = sorted[sorted.length - 1];
    }
    const m = latest.metrics;
    
    // 从日数据直接读取消耗和ROI
    const gmv = m['直播期间累计成交金额'] || 0;
    const totalCost = m['广告消耗'] || 0;
    const roi = m['投产比ROI'] || (totalCost > 0 ? gmv / totalCost : null);
    
    // KPI Cards - GMV、消耗、投产放前面
    const kpis = [
        { label: '📅 数据日期', value: latest.date, sub: '昨日数据' },
        { label: '💰 GMV成交金额', value: formatMoney(gmv), sub: '累计成交' },
        { label: '📊 广告消耗', value: formatMoney(totalCost), sub: '千川投放' },
        { label: '⚡ 投产比ROI', value: roi ? roi.toFixed(2) : '-', sub: roi >= 2 ? '优秀' : roi >= 1 ? '达标' : '待提升', color: roi >= 2 ? 'good' : roi >= 1 ? 'warn' : 'bad' },
        { label: '⏱️ 直播时长', value: m['直播时长(h)'] ? m['直播时长(h)'].toFixed(1) + 'h' : '-', sub: '小时' },
        { label: '👥 进入人数', value: formatNumber(m['进入直播间人数']), sub: 'UV' },
        { label: '👁️ 曝光人数', value: formatNumber(m['直播间曝光人数']), sub: '曝光量' },
        { label: '🎯 曝光-进入转化率', value: formatPercent(m['曝光-进入转化率']), sub: '流量转化' },
        { label: '⏱️ 时均GMV', value: formatMoney(m['时均GMV']), sub: '每小时产出' },
        { label: '📈 PCU峰值', value: formatNumber(m['PCU在线峰值']), sub: '最高在线' },
        { label: '📊 ACU均值', value: m['ACU在线均值'] ? m['ACU在线均值'].toFixed(0) : '-', sub: '平均在线' },
        { label: '⏳ 人均观看', value: m['人均观看（秒）'] ? m['人均观看（秒）'].toFixed(0) + 's' : '-', sub: '观看时长' },
        { label: '📦 订单数', value: formatNumber(m['订单数']), sub: '成交订单' },
        { label: '💬 评论数', value: formatNumber(m['评论数']), sub: '互动评论' },
    ];
    
    // 官方号增加乘方推商品数据
    if (currentAccount === '桂格官方') {
        const chengfangGmv = m['乘方推商品GMV'] || 0;
        const chengfangCost = m['乘方推商品消耗'] || 0;
        const chengfangRoi = chengfangCost > 0 ? chengfangGmv / chengfangCost : 0;
        kpis.push(
            { label: '🛒 乘方推商品GMV', value: formatMoney(chengfangGmv), sub: '商品推广成交' },
            { label: '📊 乘方推商品消耗', value: formatMoney(chengfangCost), sub: '商品推广投放' },
        );
    }
    
    document.getElementById('kpiGrid').innerHTML = kpis.map(k => `
        <div class="kpi-card">
            <div class="kpi-label">${k.label}</div>
            <div class="kpi-value ${k.color || ''}">${k.value}</div>
            <div class="kpi-sub">${k.sub}</div>
        </div>
    `).join('');
    
    // Multi Chart
    renderMultiAxisChart('chart-multi', data);
    
    // Funnel
    renderFunnel(m);
    
    // 主播排班
    renderSchedule();
    
    // 主播昨日数据 - 用上面已经计算好的昨天日期
    renderYesterdayAnchors(yesterdayStr);
    
    // 主播综合排名和对比图
    renderAnchor();
}

function renderLineChart(id, data, metrics, yName, color) {
    if (charts[id]) charts[id].dispose();
    const chart = echarts.init(document.getElementById(id));
    charts[id] = chart;
    
    const dates = data.map(d => d.date.slice(5));
    const series = metrics.map((metric, i) => ({
        name: metric,
        type: 'line',
        smooth: true,
        data: data.map(d => d.metrics[metric]),
        itemStyle: { color: i === 0 ? color : adjustColor(color, 40) },
        areaStyle: i === 0 ? { opacity: 0.1 } : undefined,
    }));
    
    chart.setOption({
        tooltip: { trigger: 'axis' },
        legend: { data: metrics, textStyle: { color: '#aaa' } },
        grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },

function renderFunnel(m) {
    const exposure = m['直播间曝光人数'] || 0;
    const enter = m['进入直播间人数'] || 0;
    const productExposure = m['商品曝光人数'] || 0;
    const productClick = m['商品点击人数'] || 0;
    const buyers = m['成交人数'] || 0;
    
    // 左边：转化漏斗数据（5个维度）
    const funnelSteps = [
        { label: '直播间曝光人数', value: formatNumber(exposure), color: 'linear-gradient(90deg, #4f6ef7, #6366f1)' },
        { label: '直播间观看人数', value: formatNumber(enter), color: 'linear-gradient(90deg, #5b7df8, #6b8af9)' },
        { label: '商品曝光人数', value: formatNumber(productExposure), color: 'linear-gradient(90deg, #6b8af9, #8ba5fa)' },
        { label: '商品点击人数', value: formatNumber(productClick), color: 'linear-gradient(90deg, #8ba5fa, #abc0fb)' },
        { label: '成交人数', value: formatNumber(buyers), color: 'linear-gradient(90deg, #abc0fb, #c5dbfc)' },
    ];
    
    document.getElementById('funnelData').innerHTML = funnelSteps.map((step, i) => `
        <div class="funnel-data-item" style="background: ${step.color}; width: ${100 - i * 6}%;">
            <span class="label">${step.label}</span>
            <span class="value">${step.value}</span>
        </div>
    `).join('');
    
    // 右边：转化率目标（4个环节）
    const rate1 = exposure > 0 ? (enter / exposure) * 100 : 0;
    const rate2 = enter > 0 ? (productExposure / enter) * 100 : 0;
    const rate3 = productExposure > 0 ? (productClick / productExposure) * 100 : 0;
    const rate4 = productClick > 0 ? (buyers / productClick) * 100 : 0;
    
    const targets = conversionTargets[currentAccount] || [15, 90, 30, 15];
    const items = [
        { label: '曝光→观看', value: rate1, target: targets[0] },
        { label: '观看→商品曝光', value: rate2, target: targets[1] },
        { label: '商品曝光→点击', value: rate3, target: targets[2] },
        { label: '商品点击→成交', value: rate4, target: targets[3] },
    ];
    
    document.getElementById('funnel').innerHTML = items.map((item, i) => {
        const status = item.value >= item.target ? 'good' : item.value >= item.target * 0.7 ? 'warn' : 'bad';
        const statusText = item.value >= item.target ? '✓ 达标' : item.value > 0 ? '未达标' : '暂无数据';
        const progress = Math.min(item.value / item.target * 100, 100);
        return `
            <div class="conversion-item">
                <div class="conversion-header">
                    <span class="conversion-label">${item.label}</span>
                    <div style="display:flex;align-items:center;gap:20px;">
                        <span class="conversion-value">${item.value > 0 ? item.value.toFixed(2) + '%' : '-'}</span>
                        <div class="conversion-target">
                            目标 <input type="number" value="${item.target}" min="0" max="100" data-index="${i}" onchange="updateTarget(this)"> %
                        </div>
                    </div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill ${status}" style="width: ${progress}%"></div>
                </div>
                <div class="conversion-status ${status}">${statusText}</div>
            </div>
        `;
    }).join('');
}

function updateTarget(input) {
    const index = parseInt(input.dataset.index);
    const value = parseFloat(input.value) || 0;
    // 更新当前账号的转化率目标
    if (!conversionTargets[currentAccount]) {
        conversionTargets[currentAccount] = [15, 90, 30, 15];
    }
    conversionTargets[currentAccount][index] = value;
    // 重新渲染
    const latest = getAccountData(currentAccount).sort((a,b) => b.date.localeCompare(a.date))[0];
    if (latest) renderFunnel(latest.metrics);
}

    const day = now.getDate();
    const daysInMonth = new Date(year, month, 0).getDate();
    
    // 筛选本月数据
    const monthPrefix = `${year}-${String(month).padStart(2, '0')}`;
    const monthData = data.filter(d => d.date.startsWith(monthPrefix));
    
    // 汇总本月数据
    let totalGmv = 0, totalCost = 0;
    monthData.forEach(d => {
        totalGmv += d.metrics['直播期间累计成交金额'] || 0;
        totalCost += d.metrics['广告消耗'] || 0;
    });
    const totalRoi = totalCost > 0 ? totalGmv / totalCost : 0;

function updateMonthlyGoal(type, value) {
    // 更新当前账号的目标值
    const numValue = parseFloat(value) || 0;
    if (!monthlyTargets[currentAccount]) {
        monthlyTargets[currentAccount] = { gmv: 1000000, cost: 500000, roi: 2.2 };
    }
    if (type === 'gmv') {
        monthlyTargets[currentAccount].gmv = numValue * 10000;  // 输入的是万，转换成元
    } else if (type === 'cost') {
        monthlyTargets[currentAccount].cost = numValue * 10000;
    } else if (type === 'roi') {
        monthlyTargets[currentAccount].roi = numValue;
    }
    // 重新渲染
    const data = getAccountData(currentAccount);
    renderMonthlyGoal(data);
}

function renderSchedule() {
    const schedule = rawData.schedule || [];
    if (!schedule.length) {
        document.getElementById('scheduleContainer').innerHTML = '<p style="color:#888;">暂无排班数据</p>';
        return;
    }
    
    // 根据实际当前日期取今日和明日
    const now = new Date();
    const todayStr = now.toISOString().split('T')[0];
    const tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate() + 1);
    const tomorrowStr = tomorrow.toISOString().split('T')[0];
    
    const today = schedule.find(s => s.date === todayStr);
    const tomorrowData = schedule.find(s => s.date === tomorrowStr);
    
    // 如果找不到今日数据，取数据中最新的有排班的一天
    const sorted = [...schedule].sort((a, b) => a.date.localeCompare(b.date));
    const displayToday = today || sorted[sorted.length - 2] || sorted[sorted.length - 1];
    const displayTomorrow = tomorrowData || sorted[sorted.length - 1];
    
    const renderDay = (dayData, label) => {
        if (!dayData) return '';
        const weekday = ['日','一','二','三','四','五','六'][new Date(dayData.date).getDay()];
        return `

                    ${label} · ${dayData.date} 周${weekday}

                            <th style="width: 35%;">优选号</th>
                        </tr>

                    <tbody>
                        ${dayData.shifts.map(s => `

                                <td style="color: #aaa; font-size: 12px;">${s.time}</td>

        if (!weeks[weekNum]) weeks[weekNum] = { dates: [], gmv: 0, traffic: 0, duration: 0, orders: 0 };
        weeks[weekNum].dates.push(d.date);
        weeks[weekNum].gmv += d.metrics['直播期间累计成交金额'] || 0;

        weeks[weekNum].duration += d.metrics['直播时长(h)'] || 0;

    const weekLabels = Object.keys(weeks).sort();

function renderAnchor() {
    const anchors = getAccountAnchors(currentAccount);
    if (!anchors.length) return;
    
    // 辅助函数：把值转成数字，空字符串或无效值返回0
    const toNum = (v) => {
        if (v === null || v === undefined || v === '') return 0;
        const n = parseFloat(v);
        return isNaN(n) ? 0 : n;
    };
    
    // Aggregate by anchor
    const anchorStats = {};
    anchors.forEach(a => {
        if (!anchorStats[a.anchor]) {
            anchorStats[a.anchor] = { anchor: a.anchor, duration: 0, gmv: 0, cost: 0, roi: 0, roiCount: 0, ctr: 0, ctrCount: 0, cvr: 0, cvrCount: 0, days: 0 };
        }
        const s = anchorStats[a.anchor];
        s.duration += toNum(a.metrics['时长']);
        s.gmv += toNum(a.metrics['整体成交金额(元)']);
        s.cost += toNum(a.metrics['消耗']);
        const roi = toNum(a.metrics['整体ROI']);
        if (roi > 0) { s.roi += roi; s.roiCount++; }
        const ctr = toNum(a.metrics['曝光点击率']);
        if (ctr > 0) { s.ctr += ctr; s.ctrCount++; }
        const cvr = toNum(a.metrics['点击成交率']);
        if (cvr > 0) { s.cvr += cvr; s.cvrCount++; }
        s.days++;
    });
    
    // Calculate composite score
    const stats = Object.values(anchorStats).map(s => ({
        ...s,
        avgRoi: s.roiCount > 0 ? s.roi / s.roiCount : 0,
        avgCtr: s.ctrCount > 0 ? s.ctr / s.ctrCount : 0,
        avgCvr: s.cvrCount > 0 ? s.cvr / s.cvrCount : 0,
        hourlyGmv: s.duration > 0 ? s.gmv / s.duration : 0,
    }));
    
    // Composite score: normalize and weight (GMV 40%, ROI 30%, hourly GMV 20%, CTR 10%)
    const maxGmv = Math.max(...stats.map(s => s.gmv), 1);
    const maxRoi = Math.max(...stats.map(s => s.avgRoi), 1);
    const maxHourly = Math.max(...stats.map(s => s.hourlyGmv), 1);
    const maxCtr = Math.max(...stats.map(s => s.avgCtr), 1);
    
    stats.forEach(s => {
        s.score = (s.gmv / maxGmv * 0.4 + s.avgRoi / maxRoi * 0.3 + s.hourlyGmv / maxHourly * 0.2 + s.avgCtr / maxCtr * 0.1) * 100;
    });
    
    stats.sort((a, b) => b.score - a.score);
    
    // Render table
    document.getElementById('anchorTableBody').innerHTML = stats.map((s, i) => `
        <tr>
            <td><span class="rank-badge ${i < 3 ? 'rank-' + (i+1) : 'rank-other'}">${i+1}</span></td>
            <td style="font-weight:600;">${s.anchor}</td>
            <td>${s.duration.toFixed(1)}</td>
            <td>${formatMoney(s.gmv)}</td>
            <td>${formatMoney(s.cost)}</td>
            <td style="color: ${s.avgRoi >= 2 ? '#4ade80' : s.avgRoi >= 1 ? '#fbbf24' : '#f87171'}">${s.avgRoi.toFixed(2)}</td>
            <td>${formatMoney(s.hourlyGmv)}</td>
            <td>${formatPercent(s.avgCtr)}</td>
            <td>${formatPercent(s.avgCvr)}</td>
        </tr>
    `).join('');
    
}

function getWeekNumber(date) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const dayNum = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

function adjustColor(color, amount) {
    const hex = color.replace('#', '');
    const r = Math.min(255, parseInt(hex.substr(0, 2), 16) + amount);
    const g = Math.min(255, parseInt(hex.substr(2, 2), 16) + amount);
    const b = Math.min(255, parseInt(hex.substr(4, 2), 16) + amount);
    return `rgb(${r}, ${g}, ${b})`;
}

function captureScreen() {

    // 截取看板内容区域，去掉两边空白
    const target = document.querySelector('.container');
    const rect = target.getBoundingClientRect();
    
    html2canvas(target, {
        backgroundColor: '#0f0f23',
        scale: 2,
        useCORS: true,
        logging: false,
        width: rect.width,
        windowWidth: rect.width,
        x: 0,
        scrollX: 0,
        scrollY: -window.scrollY
    }).then(canvas => {
        // 转换为图片并下载
        const link = document.createElement('a');
        link.download = `桂格看板_${new Date().toISOString().slice(0,10)}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        
        // 复制到剪贴板
        canvas.toBlob(blob => {
            if (navigator.clipboard && window.ClipboardItem) {
                navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
            }
        });
        
        btn.innerHTML = '✅ 已保存';
        setTimeout(() => {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }, 2000);
    }).catch(err => {
        console.error('截图失败:', err);
        btn.innerHTML = '❌ 截图失败';
        setTimeout(() => {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }, 2000);
    });
}

window.addEventListener('resize', () => {
    Object.values(charts).forEach(c => c && c.resize());
});
</script>
</body>
</html>
